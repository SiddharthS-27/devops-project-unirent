name: CI

on:
  pull_request:
  push:
    # master until the default branch is renamed to main
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  # Stage 1: work out which folders changed so later jobs run only where needed.
  changes:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.select.outputs.python }}
      frontend: ${{ steps.select.outputs.frontend }}
      stack: ${{ steps.filter.outputs.stack }}
      contract: ${{ steps.filter.outputs.contract }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend: backend/**
            payments: payments/**
            security: security/**
            workers: workers/**
            frontend: frontend/**
            workflow: .github/workflows/**
            stack:
              - backend/**
              - payments/**
              - security/**
              - workers/**
              - infra/**
              - tests/**
              - ci/**
            # The spec is generated from the backend and owned with it. Routes added
            # in payments/ or security/ reach it with the backend's next change.
            contract:
              - backend/**
              - contracts/**
              - frontend/tool/**
              - frontend/lib/api/**
      - name: Select folders to check
        id: select
        # A change to the workflow itself re-checks every folder that exists.
        run: |
          if [ "${{ steps.filter.outputs.workflow }}" = "true" ]; then
            python=$(for d in backend payments security workers; do if [ -d "$d" ]; then echo "$d"; fi; done | jq -R . | jq -sc .)
            frontend=true
          else
            python=$(echo '${{ steps.filter.outputs.changes }}' | jq -c '[.[] | select(IN("backend", "payments", "security", "workers"))]')
            frontend=${{ steps.filter.outputs.frontend }}
          fi
          echo "python=$python" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "Python folders: $python, frontend: $frontend"

  # Stage 2: lint.
  lint-python:
    name: lint (${{ matrix.folder }})
    needs: changes
    if: needs.changes.outputs.python != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        folder: ${{ fromJSON(needs.changes.outputs.python) }}
    defaults:
      run:
        working-directory: ${{ matrix.folder }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.17.2
      - run: ruff check .
      - run: ruff format --check .

  lint-flutter:
    name: lint (frontend)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze

  # Stage 3: unit tests.
  unit-python:
    name: unit (${{ matrix.folder }})
    needs: changes
    if: needs.changes.outputs.python != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        folder: ${{ fromJSON(needs.changes.outputs.python) }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: unirent
          POSTGRES_USER: unirent
          POSTGRES_PASSWORD: unirent
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U unirent" --health-interval 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: unirent
      PGPASSWORD: unirent
      PGDATABASE: unirent
      UNIRENT_DATABASE_URL: postgresql+asyncpg://unirent:unirent@localhost:5432/unirent
      UNIRENT_WORKERS_DATABASE_URL: postgresql+asyncpg://unirent:unirent@localhost:5432/unirent
      UNIRENT_REDIS_URL: redis://localhost:6379/0
      UNIRENT_ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      # A folder only becomes a Python package with its pyproject.toml; until
      # then there is nothing to install, cache or test.
      - id: package
        run: test -f "${{ matrix.folder }}/pyproject.toml" && echo "exists=true" >> "$GITHUB_OUTPUT" || true
      - uses: actions/setup-python@v5
        if: steps.package.outputs.exists == 'true'
        with:
          python-version: "3.12"
          cache: pip
      # Listing photos go to S3-compatible storage; the backend's tests upload to it.
      - name: Start MinIO for the backend
        if: steps.package.outputs.exists == 'true' && matrix.folder == 'backend'
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=unirent -e MINIO_ROOT_PASSWORD=unirent-dev-password \
            cgr.dev/chainguard/minio:latest server /data
          for i in $(seq 30); do curl -sf http://localhost:9000/minio/health/live && break; sleep 1; done
          docker exec minio mc alias set local http://localhost:9000 unirent unirent-dev-password
          docker exec minio mc mb --ignore-existing local/photos
      - name: Run unit tests
        if: steps.package.outputs.exists == 'true'
        run: ci/scripts/python-unit.sh ${{ matrix.folder }}
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.folder }}
          path: test-results-${{ matrix.folder }}.xml
          if-no-files-found: ignore

  unit-flutter:
    name: unit (frontend)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test

  # Stage 4: integration and end-to-end suites on the test Compose profile.
  integration:
    needs: [changes, unit-python]
    if: always() && needs.changes.outputs.stack == 'true' && !contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run integration suites
        run: ci/scripts/integration.sh
      - name: Keep API logs and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-results
          path: |
            integration-api.log
            test-results/
          if-no-files-found: ignore

  # Stage 5: known-vulnerable dependencies and committed secrets. Images are
  # scanned by Trivy in the images job, right after they are built.
  scan:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python dependencies (pip-audit)
        run: ci/scripts/pip-audit.sh
      - name: App dependencies (osv-scanner on pubspec.lock)
        uses: google/osv-scanner-action/osv-scanner-action@v2.0.2
        with:
          scan-args: --lockfile=frontend/pubspec.lock

  # Stage 6: the committed spec and the generated app client are current.
  contract:
    needs: changes
    if: needs.changes.outputs.contract == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true
      - name: Install the api packages
        run: |
          for pkg in security payments backend; do
            if [ -f "$pkg/pyproject.toml" ]; then pip install -e "./$pkg"; fi
          done
      - name: Fetch app packages
        working-directory: frontend
        run: flutter pub get
      - name: Compare spec and client with the code
        run: ci/scripts/contract-check.sh

  # Stage 7: build the api and workers images, tagged with the commit SHA.
  # Pushed to GHCR only from master.
  images:
    needs: [changes, unit-python, contract]
    if: always() && needs.changes.outputs.stack == 'true' && !contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [api, workers]
    steps:
      - uses: actions/checkout@v4
      - name: Skip images whose Dockerfile or package doesn't exist yet
        id: exists
        run: |
          # The workers image installs workers/ as a package, which arrives after its Dockerfile.
          if [ -f infra/docker/${{ matrix.image }}.Dockerfile ] \
            && { [ "${{ matrix.image }}" != workers ] || [ -f workers/pyproject.toml ]; }; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
      # Image names must be lowercase; the repository owner may not be.
      - name: Image name
        id: image
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/unirent-${{ matrix.image }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
        if: steps.exists.outputs.build == 'true'
      - uses: docker/login-action@v3
        if: steps.exists.outputs.build == 'true' && github.ref == 'refs/heads/master'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        if: steps.exists.outputs.build == 'true'
        with:
          context: .
          file: infra/docker/${{ matrix.image }}.Dockerfile
          push: ${{ github.ref == 'refs/heads/master' }}
          load: ${{ github.ref != 'refs/heads/master' }}
          tags: ${{ steps.image.outputs.ref }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Scan the image (Trivy)
        if: steps.exists.outputs.build == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  # Branch protection requires only this job. The jobs above are skipped when their
  # folders didn't change, so they can't be required checks themselves.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, lint-python, lint-flutter, unit-python, unit-flutter, integration, scan, contract, images]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed or was cancelled
        run: |
          echo '${{ toJSON(needs) }}' | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo '${{ toJSON(needs) }}' | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
