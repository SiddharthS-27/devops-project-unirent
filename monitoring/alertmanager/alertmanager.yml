# Alerts go to one webhook (a Slack or Discord incoming webhook works, or any
# HTTP endpoint). The URL is read from a file mounted at deploy time, so it
# never sits in the repo.
global:
  resolve_timeout: 5m

route:
  receiver: team
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 3h
  routes:
    - matchers: [severity="critical"]
      receiver: team
      repeat_interval: 30m

receivers:
  - name: team
    webhook_configs:
      - url_file: /etc/alertmanager/secrets/webhook_url
        send_resolved: true

inhibit_rules:
  # A down container explains its other alerts.
  - source_matchers: [alertname="ContainerDown"]
    target_matchers: [severity="warning"]
    equal: [job]
