# Prometheus for UniRent. Every service is scraped every 15 seconds.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: unirent

scrape_configs:
  # The api: request latency, booking transitions, business gauges, and the
  # security and payments counters (one registry, one endpoint).
  - job_name: api
    metrics_path: /metrics/
    static_configs:
      - targets: ["api:8000"]

  # Workers: relay, consumers, retries, dead letters, pushes, timers.
  - job_name: workers
    static_configs:
      - targets: ["workers:9100"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  # Consumer lag per group and topic.
  - job_name: kafka
    static_configs:
      - targets: ["kafka-exporter:9308"]

  - job_name: containers
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
