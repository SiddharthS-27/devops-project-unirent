# Ships every container's stdout to Loki. The api and workers log JSON lines,
# so their level, logger and request_id become searchable fields.
server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
        filters:
          - name: label
            values: ["com.docker.compose.project=unirent"]
    relabel_configs:
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service
      - source_labels: [__meta_docker_container_name]
        regex: /(.*)
        target_label: container
    pipeline_stages:
      - match:
          selector: '{service=~"api|workers"}'
          stages:
            - json:
                expressions:
                  level: level
                  logger: logger
                  request_id: request_id
            - labels:
                level:
            - structured_metadata:
                request_id:
                logger:
