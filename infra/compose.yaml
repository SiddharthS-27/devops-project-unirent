name: unirent

# Profiles:
#   (none)   postgres, redis, kafka and minio run in every profile
#   dev      api with hot reload (`make watch`), kafka-ui
#   test     api, workers and the Razorpay simulator (CI and make test-*)
#   runner   the test-runner, started on demand by make test-* and CI
#   staging  api and workers from registry images, plus the monitoring stack
#   init     one-shot jobs that make up runs once the stack is healthy
#   tunnel   a cloudflared quick tunnel to the api, for Razorpay webhooks (opt-in)
#   monitoring  Prometheus, Grafana and the exporters (part of staging; opt-in in dev)

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      WORKERS_DB_USER: ${WORKERS_DB_USER}
      WORKERS_DB_PASSWORD: ${WORKERS_DB_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "29092:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  minio:
    image: cgr.dev/chainguard/minio:latest  # official minio images are no longer published; this one bundles mc
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: cgr.dev/chainguard/minio:latest
    profiles: [init]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD
      && mc mb --ignore-existing local/$$MINIO_BUCKET"

  api:
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    image: ${API_IMAGE:-unirent-api:dev}
    profiles: [dev, test, staging]
    restart: unless-stopped
    # API_RELOAD=--reload in dev; empty elsewhere.
    command:
      - sh
      - -c
      - >-
        exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers
        --forwarded-allow-ips "$${FORWARDED_ALLOW_IPS:-127.0.0.1}" $${API_RELOAD:-}
    environment:
      UNIRENT_ENVIRONMENT: ${ENVIRONMENT:-dev}
      UNIRENT_DATABASE_URL: postgresql+asyncpg://${APP_DB_USER}:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      UNIRENT_MIGRATION_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      UNIRENT_REDIS_URL: redis://redis:6379/0
      UNIRENT_SERVICE_TOKEN: ${SERVICE_TOKEN}
      UNIRENT_LOG_LEVEL: ${LOG_LEVEL:-INFO}
      UNIRENT_JWT_SECRET: ${JWT_SECRET}
      UNIRENT_MS_AUTH_MODE: ${MS_AUTH_MODE:-mock}
      UNIRENT_MS_CLIENT_ID: ${MS_CLIENT_ID:-mock-client}
      UNIRENT_MS_TENANT_ID: ${MS_TENANT_ID:-mock-tenant}
      UNIRENT_MS_ALLOWED_DOMAIN: ${MS_ALLOWED_DOMAIN:-college.edu}
      UNIRENT_PHONE_AUTH_MODE: ${PHONE_AUTH_MODE:-mock}
      UNIRENT_FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-unirent-dev}
      UNIRENT_STORAGE_ENDPOINT: minio:9000
      UNIRENT_STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL:-http://localhost:9000}
      UNIRENT_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER}
      UNIRENT_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      UNIRENT_STORAGE_BUCKET: ${MINIO_BUCKET}
      UNIRENT_RAZORPAY_API_BASE: ${RAZORPAY_API_BASE:-http://razorpay-sim:8090}
      UNIRENT_RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      UNIRENT_RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      UNIRENT_RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}
      UNIRENT_ADMIN_EMAIL: ${ADMIN_EMAIL}
      UNIRENT_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      UNIRENT_SIGNIN_LIMIT_PER_MINUTE: ${SIGNIN_LIMIT_PER_MINUTE:-10}
      API_RELOAD: ${API_RELOAD:-}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
    ports:
      - "${API_BIND:-0.0.0.0}:${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    # `make watch` syncs source changes into the container; uvicorn reloads them.
    develop:
      watch:
        - action: sync
          path: ../backend
          target: /src/backend
        - action: sync
          path: ../security
          target: /src/security
        - action: sync
          path: ../payments
          target: /src/payments

  workers:
    build:
      context: ..
      dockerfile: infra/docker/workers.Dockerfile
    image: ${WORKERS_IMAGE:-unirent-workers:dev}
    profiles: [dev, test, staging]
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      UNIRENT_ENVIRONMENT: ${ENVIRONMENT:-dev}
      UNIRENT_WORKERS_DATABASE_URL: postgresql+asyncpg://${WORKERS_DB_USER}:${WORKERS_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      UNIRENT_MIGRATION_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      UNIRENT_KAFKA_BOOTSTRAP: kafka:9092
      UNIRENT_API_BASE_URL: http://api:8000
      UNIRENT_SERVICE_TOKEN: ${SERVICE_TOKEN}
      UNIRENT_PUSH_MODE: ${PUSH_MODE:-log}
      UNIRENT_FCM_PROJECT_ID: ${FIREBASE_PROJECT_ID:-unirent-dev}
      UNIRENT_FCM_CREDENTIALS_FILE: /run/secrets/fcm.json
      UNIRENT_LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      # Only read when PUSH_MODE=fcm; an empty placeholder is fine otherwise.
      - ${FCM_CREDENTIALS:-./env/fcm.json.example}:/run/secrets/fcm.json:ro
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      api:
        condition: service_healthy

  # One-shot: create the topics in workers/topics.yaml before anything uses them.
  kafka-init:
    image: apache/kafka:3.8.0
    profiles: [dev, test, staging]
    entrypoint: ["sh", "/create-topics.sh", "/topics.yaml"]
    volumes:
      - ../workers/topics.yaml:/topics.yaml:ro
      - ./scripts/create-topics.sh:/create-topics.sh:ro
    depends_on:
      kafka:
        condition: service_healthy

  # Opt-in (`make tunnel`): a public HTTPS URL for the api, so Razorpay test-mode
  # webhooks reach a laptop. Set the webhook URL in the Razorpay dashboard to
  # <tunnel URL>/api/v1/payments/webhooks/razorpay.
  tunnel:
    image: cloudflare/cloudflared:2024.12.2
    profiles: [tunnel]
    command: ["tunnel", "--no-autoupdate", "--url", "http://api:8000"]
    depends_on:
      api:
        condition: service_healthy

  # The Razorpay simulator: the same API shapes, signed webhooks to the api.
  razorpay-sim:
    build:
      context: ..
      dockerfile: infra/docker/tests.Dockerfile
    image: ${TESTS_IMAGE:-unirent-tests:dev}
    profiles: [dev, test]
    command: ["uvicorn", "razorpay_sim.app:app", "--host", "0.0.0.0", "--port", "8090"]
    environment:
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}
      WEBHOOK_URL: http://api:8000/api/v1/payments/webhooks/razorpay
    ports:
      - "${RAZORPAY_SIM_PORT:-8090}:8090"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/healthz')"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Runs the suites in tests/ against the stack: make test-integration and CI.
  test-runner:
    image: ${TESTS_IMAGE:-unirent-tests:dev}
    profiles: [runner]
    environment:
      BASE_URL: http://api:8000
      SIM_URL: http://razorpay-sim:8090
      SERVICE_TOKEN: ${SERVICE_TOKEN}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      MS_ALLOWED_DOMAIN: ${MS_ALLOWED_DOMAIN:-college.edu}
    volumes:
      - ../test-results:/results
    depends_on:
      api:
        condition: service_healthy
      razorpay-sim:
        condition: service_healthy

  # Staging's HTTPS front door (infra/caddy/Caddyfile).
  caddy:
    image: caddy:2.8.4
    profiles: [staging]
    environment:
      STAGING_DOMAIN: ${STAGING_DOMAIN:-localhost}
      GRAFANA_DOMAIN: ${GRAFANA_DOMAIN:-grafana.localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      api:
        condition: service_healthy

  # Monitoring (Sasvat's configs in monitoring/): staging, or dev with --profile monitoring.
  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: [staging, monitoring]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ../monitoring/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 10s
      retries: 6

  grafana:
    image: grafana/grafana:11.3.1
    profiles: [staging, monitoring]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_started

  alertmanager:
    image: prom/alertmanager:v0.27.0
    profiles: [staging, monitoring]
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    volumes:
      - ../monitoring/alertmanager:/etc/alertmanager:ro
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"

  loki:
    image: grafana/loki:3.3.2
    profiles: [staging, monitoring]
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ../monitoring/loki:/etc/loki:ro
      - loki-data:/loki

  promtail:
    image: grafana/promtail:3.3.2
    profiles: [staging, monitoring]
    command: ["-config.file=/etc/promtail/promtail.yml"]
    volumes:
      - ../monitoring/promtail:/etc/promtail:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.16.0
    profiles: [staging, monitoring]
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  redis-exporter:
    image: oliver006/redis_exporter:v1.66.0
    profiles: [staging, monitoring]
    environment:
      REDIS_ADDR: redis://redis:6379

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.8.0
    profiles: [staging, monitoring]
    command: ["--kafka.server=kafka:9092"]
    depends_on:
      kafka:
        condition: service_healthy

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    profiles: [staging, monitoring]
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

  node-exporter:
    image: prom/node-exporter:v1.8.2
    profiles: [staging, monitoring]
    command: ["--path.rootfs=/host"]
    volumes:
      - /:/host:ro,rslave

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.2.0
    profiles: [dev]
    environment:
      KAFKA_CLUSTERS_0_NAME: unirent
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "${KAFKA_UI_PORT:-8080}:8080"
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  caddy-data:
  prometheus-data:
  loki-data:
  grafana-data:
  postgres-data:
  redis-data:
  kafka-data:
  minio-data:
